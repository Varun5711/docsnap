services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: docsnap
      POSTGRES_PASSWORD: docsnap
      POSTGRES_DB: docsnap
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ../services/api/migrations:/docker-entrypoint-initdb.d:ro

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: docsnap
      MINIO_ROOT_PASSWORD: docsnap-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data

