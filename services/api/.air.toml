root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/air-bin ./cmd/api"
  bin = "./tmp/air-bin"
  entrypoint = ["./tmp/air-bin"]
  include_ext = ["go"]
  exclude_dir = ["tmp", "migrations"]
  delay = 1000
  stop_on_error = true
  send_interrupt = true

[log]
  time = true

[misc]
  clean_on_exit = false
